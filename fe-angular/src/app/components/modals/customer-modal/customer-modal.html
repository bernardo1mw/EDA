@if (isOpen()) {
  <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div role="dialog" aria-modal="true" aria-labelledby="customer-modal-title" class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-lg w-full mx-4 p-6">
      <h2 id="customer-modal-title" class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-4">
        {{ customer ? 'Editar Cliente' : 'Novo Cliente' }}
      </h2>

      @if (error()) {
        <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4 mb-4">
          <p class="text-red-800 dark:text-red-200 text-sm">{{ error() }}</p>
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <mat-form-field class="w-full">
          <mat-label>Nome *</mat-label>
          <input matInput [(ngModel)]="formData.name" name="name" required
            (ngModelChange)="clearError('name')" [attr.aria-invalid]="!!errors()['name']">
        </mat-form-field>
        @if (errors()['name']) {
          <p class="text-sm text-red-500 mt-1">{{ errors()['name'] }}</p>
        }

        <mat-form-field class="w-full">
          <mat-label>Email *</mat-label>
          <input matInput type="email" [(ngModel)]="formData.email" name="email" required
            (ngModelChange)="clearError('email')" [attr.aria-invalid]="!!errors()['email']">
        </mat-form-field>
        @if (errors()['email']) {
          <p class="text-sm text-red-500 mt-1">{{ errors()['email'] }}</p>
        }

        <mat-form-field class="w-full">
          <mat-label>Telefone</mat-label>
          <input matInput [(ngModel)]="formData.phone" name="phone">
        </mat-form-field>

        <mat-form-field class="w-full">
          <mat-label>Endereço</mat-label>
          <input matInput [(ngModel)]="formData.address" name="address">
        </mat-form-field>

        <div class="flex gap-3 pt-4">
          <button mat-raised-button color="primary" type="submit" [disabled]="isLoading()">
            {{ isLoading() ? 'Salvando...' : (customer ? 'Salvar' : 'Criar Cliente') }}
          </button>
          <button mat-button type="button" (click)="onClose()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
}
