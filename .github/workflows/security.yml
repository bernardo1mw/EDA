name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [fe-next, fe-angular, services/payment-service-nestjs]
    steps:
      - uses: actions/checkout@v4
      - run: cd ${{ matrix.dir }} && npm ci --ignore-scripts --legacy-peer-deps && npm audit --audit-level=critical

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: cd services/orders-api-python && pip-audit -r requirements.txt
